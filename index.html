<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UraNai+（うらないプラス）</title>
<meta name="description" content="質問にこたえるタイプ診断と、名前で占う相性診断。相性診断の名前は相手にはわからない。">
<!-- OGP（SNS で URL を貼ったときに出るカード）。画像は tools/make-ogp.ps1 で作る -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UraNai+（うらないプラス）">
<meta property="og:title" content="UraNai+（うらないプラス）">
<meta property="og:description" content="質問にこたえるタイプ診断と、名前で占う相性診断。相性診断の名前は相手にはわからない。">
<meta property="og:url" content="https://kaikomziu.github.io/uranai-plus/">
<meta property="og:image" content="https://kaikomziu.github.io/uranai-plus/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UraNai+ うらないプラス">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="list/aisho.css">
<style>
  html { scroll-behavior: smooth; }
  body {
    /* トップだけは登場演出のあとにタスクバーとプレイヤーが出てくる */
    --bar-delay: 2.2s;
    --player-delay: 2.4s;
  }

  /* ===== タイトル（画面いっぱい。ロゴは中央より少し上） ===== */
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px 12vh;
    text-align: center;
  }

  .logo {
    font-family: var(--font-en);
    font-weight: 600;
    font-size: clamp(60px, 15vw, 150px);
    line-height: 1;
    letter-spacing: -0.035em;
    white-space: nowrap;
  }

  /* 1文字ずつ、ぼかしが取れながら下からふわっと出る */
  .logo .ch {
    display: inline-block;
    animation: chIn 0.9s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: calc(0.25s + var(--i) * 0.07s);
  }

  /* 「+」だけアクセントの色で、くるっと回って出る */
  .logo .plus {
    display: inline-block;
    margin-left: 0.04em;
    color: var(--accent);
    font-weight: 500;
    animation: plusIn 0.8s cubic-bezier(.2,.8,.2,1) 0.95s both;
  }

  .rule {
    width: 120px;
    height: 1px;
    margin: 28px auto 0;
    background: var(--ink);
    transform-origin: center;
    animation: ruleIn 0.8s cubic-bezier(.2,.8,.2,1) 1.25s both;
  }

  .sub {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.5em;
    padding-left: 0.5em; /* 字間ぶんのずれを戻して中央に */
    color: var(--muted);
    animation: rise 0.7s cubic-bezier(.2,.8,.2,1) 1.45s both;
  }

  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: var(--font-en);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-decoration: none;
    animation: fadeIn 0.8s ease 1.8s both;
  }
  .scroll-hint i { width: 1px; height: 34px; background: linear-gradient(var(--ink), transparent); animation: drip 1.8s ease-in-out infinite; }

  /* ===== 下の2つのセクション（診断 → 相性診断） ===== */
  .sections {
    width: min(560px, 100%);
    margin: 0 auto;
    padding: 20px 16px 120px;
    display: grid;
    gap: 64px;
  }
  .sections section { scroll-margin-top: 80px; }

  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .sec-num { font-family: var(--font-en); font-size: 13px; color: var(--accent); }
  .sec-en { font-family: var(--font-en); font-size: 12px; letter-spacing: 0.24em; color: var(--muted); }
  .sec-line { flex: 1; height: 1px; background: var(--line); }

  .type-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 26px 24px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.2s;
  }
  .type-card:hover { border-color: var(--ink); }
  .type-text { flex: 1; min-width: 0; }
  .type-title { display: block; font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
  .type-desc { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.8; }
  .type-go {
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-en);
    font-size: 18px;
    transition: background 0.2s, transform 0.2s;
  }
  .type-card:hover .type-go { background: var(--accent); transform: translateX(3px); }

  .foot { margin-top: -24px; text-align: center; font-family: var(--font-en); font-size: 11px; letter-spacing: 0.2em; color: #a9a7a0; }

  @keyframes chIn {
    from { opacity: 0; transform: translateY(0.35em); filter: blur(10px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes plusIn {
    from { opacity: 0; transform: rotate(-180deg) scale(0.4); }
    to { opacity: 1; transform: none; }
  }
  @keyframes ruleIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes drip {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }
</style>
</head>
<body>
  <main class="hero">
    <h1 class="logo" aria-label="UraNai+">
      <span class="ch" style="--i:0">U</span><span class="ch" style="--i:1">r</span><span class="ch" style="--i:2">a</span><span class="ch" style="--i:3">N</span><span class="ch" style="--i:4">a</span><span class="ch" style="--i:5">i</span><span class="plus">+</span>
    </h1>
    <div class="rule"></div>
    <p class="sub">うらないプラス</p>
    <a class="scroll-hint" href="#shindan">SCROLL<i></i></a>
  </main>

  <div class="sections">
    <!-- 1. ふつうの診断 -->
    <section id="shindan">
      <div class="sec-head"><span class="sec-num">01</span><span class="sec-en">DIAGNOSIS</span><span class="sec-line"></span></div>
      <a class="type-card" id="typeCard" href="list/50o72qn/">
        <span class="type-text">
          <span class="type-title">タイプ診断</span>
          <span class="type-desc">10の質問にこたえると、6つのタイプのどれに近いかがわかります。</span>
        </span>
        <span class="type-go" aria-hidden="true">→</span>
      </a>
    </section>

    <!-- 2. 相性診断（名前で占う。名前は相手にはひみつ） -->
    <section id="aisho">
      <div class="sec-head"><span class="sec-num">02</span><span class="sec-en">COMPATIBILITY</span><span class="sec-line"></span></div>
      <div class="aisho-card">
        <h2 class="aisho-head">相性診断</h2>
        <p class="aisho-lead">ふたりの名前を入れるだけで、相性がわかります。</p>
        <div class="aisho-names">
          <div class="aisho-field"><label for="nameA">あなたの名前</label><input class="aisho-input" id="nameA" maxlength="12" autocomplete="off" placeholder="なまえ"></div>
          <span class="aisho-x">×</span>
          <div class="aisho-field"><label for="nameB">相手の名前</label><input class="aisho-input" id="nameB" maxlength="12" autocomplete="off" placeholder="なまえ"></div>
        </div>
        <p class="aisho-err" id="aishoErr"></p>
        <button class="aisho-btn" id="aishoBtn" type="button">診断する</button>
        <p class="aisho-lock">入れた名前はこの端末にだけ保存されます。<br>結果のURLを送っても、相手には名前は表示されません。</p>
      </div>
    </section>

    <p class="foot">UraNai+</p>
  </div>

<script src="audio.js"></script>
<script src="common.js"></script>
<script src="list/aisho.js"></script>
<script>
  // ===== 診断・相性診断 =====
  document.getElementById("typeCard").addEventListener("pointerdown", () => Sound.se("click", { volume: 0.7 }));
  Aisho.bindForm({
    a: document.getElementById("nameA"),
    b: document.getElementById("nameB"),
    btn: document.getElementById("aishoBtn"),
    err: document.getElementById("aishoErr"),
  });

  // ===== 登場演出に合わせた効果音（音が出せる状態のときだけ鳴る） =====
  document.querySelectorAll(".logo .ch").forEach((ch, i) => {
    // 文字が出てくるタイミング（CSS の animation-delay と同じ計算）
    setTimeout(() => Sound.se("tick", { volume: 0.35, rate: 1 + i * 0.06 }), (0.35 + i * 0.07) * 1000);
  });
  setTimeout(() => Sound.se("accent", { volume: 0.7 }), 1100); // 「+」
  setTimeout(() => Sound.se("whoosh", { volume: 0.45 }), 2200); // タスクバー
</script>
</body>
</html>
