<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UraNai+（うらないプラス）</title>
<meta name="description" content="ポップでかわいい占いサイト。タイプ診断・今日の運勢・タロット・おみくじに、URLを送って相手と遊べる相性占いやクイズも！">
<!-- OGP（SNS で URL を貼ったときに出るカード）。画像は tools/make-ogp.ps1 で作る -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UraNai+（うらないプラス）">
<meta property="og:title" content="UraNai+（うらないプラス）">
<meta property="og:description" content="ポップでかわいい占いサイト。タイプ診断・今日の運勢・タロット・おみくじに、URLを送って相手と遊べる相性占いやクイズも！">
<meta property="og:url" content="https://kaikomziu.github.io/uranai-plus/">
<meta property="og:image" content="https://kaikomziu.github.io/uranai-plus/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UraNai+ うらないプラス">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; }
  body {
    overflow: hidden;
    /* トップだけは登場演出のあとにタスクバーとプレイヤーが出てくる */
    --bar-delay: 3s;
    --player-delay: 3.2s;
  }

  /* 飾りが出てくる順番（ロゴの登場が終わってから） */
  .deco:nth-of-type(1) { --in: 2.2s; }
  .deco:nth-of-type(2) { --in: 2.3s; }
  .deco:nth-of-type(3) { --in: 2.4s; }
  .deco:nth-of-type(4) { --in: 2.5s; }
  .deco:nth-of-type(5) { --in: 2.6s; }
  .deco:nth-of-type(6) { --in: 2.7s; }
  .deco:nth-of-type(7) { --in: 2.8s; }
  .deco:nth-of-type(8) { --in: 2.9s; }

  /* タイトルは画面中央より少し上 */
  .hero {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px 14vh;
    text-align: center;
  }

  .logo {
    font-family: "Fredoka", "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: clamp(64px, 14vw, 160px);
    line-height: 1;
    white-space: nowrap;
    position: relative;
  }

  /* 「+」が出た瞬間に後ろでパッと広がる光 */
  .logo::before,
  .logo::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1.6em;
    height: 1.6em;
    margin: -0.8em 0 0 -0.8em;
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  .logo::before {
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,207,63,0.45) 40%, transparent 70%);
    animation: flash 1.1s ease-out 1.25s both;
  }
  .logo::after {
    border: 0.05em solid #ff8cc0;
    animation: ring 1s ease-out 1.25s both;
  }

  /* 1文字ずつ色を変えて、順番にぽよんと弾ませる */
  .logo .ch {
    display: inline-block;
    color: var(--c);
    -webkit-text-stroke: 0.04em #fff;
    paint-order: stroke fill;
    text-shadow: 0 0.06em 0 var(--sh);
    animation: drop 0.75s cubic-bezier(.3,1.5,.5,1) both, bounce 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 1.4 + 0.35s), calc(var(--i) * 1.4 + 3s);
  }

  /* 「+」は丸いバッジにして目立たせる */
  .logo .plus {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.62em;
    height: 0.62em;
    margin-left: 0.08em;
    vertical-align: 0.45em;
    border-radius: 50%;
    background: #ffcf3f;
    color: #fff;
    font-size: 0.75em;
    box-shadow: 0 0.06em 0 #f0a400, 0 0 0 0.05em #fff;
    animation: spinIn 0.7s cubic-bezier(.3,1.6,.5,1) both, spin 4s ease-in-out infinite;
    animation-delay: 1.1s, 3.2s;
  }

  .logo .plus span { transform: translateY(-0.04em); }

  .sub {
    margin-top: 26px;
    padding: 8px 22px;
    border-radius: 999px;
    background: #fff;
    color: #ff5fa2;
    font-size: clamp(14px, 2.6vw, 18px);
    letter-spacing: 0.25em;
    box-shadow: 0 4px 0 #ffb3d4;
    animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 1.6s both;
  }

  /* ===== タイトルの下: 占いの入口 ===== */
  .entry {
    margin-top: 28px;
    width: min(420px, 100%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 22px;
    background: #fff;
    border: 3px solid #fff;
    box-shadow: 0 6px 0 #ffc4de, 0 12px 30px rgba(255, 95, 162, 0.18);
    color: inherit;
    text-decoration: none;
    text-align: left;
    animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 1.9s both;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .entry:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #ffc4de, 0 16px 34px rgba(255, 95, 162, 0.22); }
  .entry:active { transform: translateY(3px); box-shadow: 0 2px 0 #ffc4de; }

  .entry-ico {
    flex: none;
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #ffd6ec, #e3d9ff);
    font-size: 30px;
  }

  .entry-text { flex: 1; min-width: 0; }
  .entry-title, .entry-desc { display: block; }
  .entry-title { font-size: 19px; color: #ff5fa2; }
  .entry-desc { margin-top: 2px; font-size: 12px; font-weight: 500; color: #7a6e98; line-height: 1.5; }

  .entry-go {
    flex: none;
    padding: 8px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff8cc0, #b69bff);
    color: #fff;
    font-size: 14px;
    box-shadow: 0 3px 0 rgba(118, 70, 224, 0.3);
  }

  .more {
    margin-top: 14px;
    color: #7646e0;
    font-size: 13px;
    text-decoration: none;
    animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 2.1s both;
  }

  .more:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .entry { gap: 10px; padding: 12px; }
    .entry-ico { width: 48px; height: 48px; font-size: 26px; }
    .entry-go { padding: 7px 11px; font-size: 13px; }
  }

  /* 画面の高さが低いときは上に詰める */
  @media (max-height: 640px) {
    .hero { padding-bottom: 80px; }
    .sub { margin-top: 16px; }
    .entry { margin-top: 18px; }
  }

  @keyframes drop {
    0%   { opacity: 0; transform: translateY(-0.8em) rotate(-25deg) scale(0.4); filter: blur(8px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); filter: blur(0); }
  }

  @keyframes spinIn {
    from { opacity: 0; transform: rotate(-540deg) scale(0); }
    to   { opacity: 1; transform: rotate(0) scale(1); }
  }

  @keyframes flash {
    0%   { opacity: 0; transform: scale(0.2); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: scale(3.5); }
  }

  @keyframes ring {
    0%   { opacity: 0; transform: scale(0.3); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: scale(4); }
  }

  @keyframes bounce {
    0%, 70%, 100% { transform: translateY(0); }
    80% { transform: translateY(-0.12em) rotate(-4deg); }
    90% { transform: translateY(0.02em); }
  }

  @keyframes spin {
    0%, 60%, 100% { transform: rotate(0) scale(1); }
    80% { transform: rotate(180deg) scale(1.15); }
  }
</style>
</head>
<body>
  <!-- 背景の飾り -->
  <span class="deco" style="--x:8%;--y:14%;--s:34px;--d:5s;--delay:0s">⭐</span>
  <span class="deco" style="--x:84%;--y:16%;--s:40px;--d:6s;--delay:-1s">🌙</span>
  <span class="deco" style="--x:6%;--y:72%;--s:30px;--d:4.5s;--delay:-2s">💖</span>
  <span class="deco" style="--x:86%;--y:66%;--s:36px;--d:5.5s;--delay:-3s">🔮</span>
  <span class="deco" style="--x:48%;--y:84%;--s:26px;--d:4s;--delay:-1.5s">✨</span>
  <span class="deco" style="--x:30%;--y:8%;--s:22px;--d:4.8s;--delay:-2.5s">✨</span>
  <span class="deco" style="--x:92%;--y:44%;--s:24px;--d:5.2s;--delay:-0.5s">⭐</span>
  <span class="deco" style="--x:4%;--y:42%;--s:26px;--d:6.2s;--delay:-4s">🍀</span>

  <main class="hero">
    <h1 class="logo" aria-label="UraNai+">
      <span class="ch" style="--c:#ff5fa2;--sh:#d63d80;--i:0s">U</span><span class="ch" style="--c:#ff8a3d;--sh:#d9661c;--i:0.08s">r</span><span class="ch" style="--c:#ffbf1f;--sh:#d99a00;--i:0.16s">a</span><span class="ch" style="--c:#3ec97a;--sh:#22a35b;--i:0.24s">N</span><span class="ch" style="--c:#3fb4ff;--sh:#1b8fd9;--i:0.32s">a</span><span class="ch" style="--c:#9b6bff;--sh:#7646e0;--i:0.4s">i</span><span class="plus"><span>+</span></span>
    </h1>
    <p class="sub">うらないプラス</p>

    <!-- タイトルの下: タイプ診断の入口（中身は common.js の FORTUNES から） -->
    <a class="entry" id="entry" href="list/">
      <span class="entry-ico" id="entryIco">🧩</span>
      <span class="entry-text">
        <span class="entry-title" id="entryTitle">タイプ診断</span>
        <span class="entry-desc" id="entryDesc"></span>
      </span>
      <span class="entry-go">はじめる ▶</span>
    </a>
    <a class="more" href="list/">🔮 ほかの占いも見る →</a>
  </main>

<script src="audio.js"></script>
<script src="common.js"></script>
<script>
  // ===== タイトル下の入口をタイプ診断にする =====
  const typeTest = FORTUNES.find(f => f.title === "タイプ診断");
  document.getElementById("entry").href = fortuneUrl(typeTest);
  document.getElementById("entryIco").textContent = typeTest.emoji;
  document.getElementById("entryTitle").textContent = typeTest.title;
  document.getElementById("entryDesc").textContent = typeTest.desc;
  document.getElementById("entry").addEventListener("pointerdown", () => Sound.se("click", { volume: 0.7 }));

  // ===== 登場演出に合わせた効果音（音が出せる状態のときだけ鳴る） =====
  document.querySelectorAll(".logo .ch").forEach((ch, i) => {
    // 文字が着地する瞬間（アニメ開始 + 0.45 秒）
    const delay = parseFloat(getComputedStyle(ch).getPropertyValue("--i")) * 1.4 + 0.35 + 0.45;
    setTimeout(() => Sound.se("tick", { volume: 0.5, rate: 1 + i * 0.08 }), delay * 1000);
  });
  setTimeout(() => Sound.se("accent", { volume: 0.9 }), 1250); // 「+」と光の輪
  setTimeout(() => Sound.se("whoosh", { volume: 0.6 }), 3000); // タスクバー
</script>
</body>
</html>
