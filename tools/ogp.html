<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- OGP画像（1200×630）を作るためのページ。tools/make-ogp.ps1 でヘッドレスの Edge から ogp.png に書き出す -->
<title>UraNai+ OGP</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: #f3f2ee;
    color: #15161a;
    font-family: "Zen Kaku Gothic New", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 外側の細い枠 */
  .frame { position: absolute; inset: 36px; border: 1px solid #dedcd5; border-radius: 22px; }

  .corner { position: absolute; font-family: "Outfit", sans-serif; font-size: 18px; letter-spacing: 0.28em; color: #72757e; }
  .tl { top: 64px; left: 72px; }
  .br { bottom: 64px; right: 72px; }
  .tl b, .br b { color: #3b47e0; font-weight: 500; margin-right: 14px; }

  .logo { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 200px; line-height: 1; letter-spacing: -0.035em; }
  .logo span { color: #3b47e0; font-weight: 500; margin-left: 0.04em; }

  .rule { width: 160px; height: 2px; margin-top: 40px; background: #15161a; }
  .sub { margin-top: 26px; font-size: 30px; letter-spacing: 0.5em; padding-left: 0.5em; color: #72757e; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"><b>01</b>DIAGNOSIS</div>
  <div class="corner br"><b>02</b>COMPATIBILITY</div>
  <h1 class="logo">UraNai<span>+</span></h1>
  <div class="rule"></div>
  <p class="sub">うらないプラス</p>
</body>
</html>
