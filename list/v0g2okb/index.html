<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わたしのこと知ってる？クイズ | UraNai+（うらないプラス）</title>
<meta name="description" content="自分のことをこたえてURLを送ると、相手があなたの答えを当てるクイズに！どれだけわかりあえているかチェックしよう。">
<!-- OGP（SNS で URL を貼ったときに出るカード）。画像は tools/make-ogp.ps1 で作る -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UraNai+（うらないプラス）">
<meta property="og:title" content="わたしのこと知ってる？クイズ | UraNai+（うらないプラス）">
<meta property="og:description" content="自分のことをこたえてURLを送ると、相手があなたの答えを当てるクイズに！どれだけわかりあえているかチェックしよう。">
<meta property="og:url" content="https://kaikomziu.github.io/uranai-plus/list/v0g2okb/">
<meta property="og:image" content="https://kaikomziu.github.io/uranai-plus/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UraNai+ うらないプラス">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../common.css">
<link rel="stylesheet" href="../fortune.css">
<style>
  /* クイズは黄色〜オレンジの元気な色 */
  .panel { box-shadow: 0 8px 0 #ffe39a, 0 16px 40px rgba(255, 191, 31, 0.22); }
  .title { color: #e09000; }
  .invite { background: #fff8dc; --accent: #d98a00; }

  /* 正解・不正解の発表 */
  .choice.correct { background: #eafaf1; border-color: #3ec97a; box-shadow: 0 4px 0 #bfeccf; }
  .choice.wrong { background: #fff0f3; border-color: #ff7a9a; }
  .choice .judge { margin-left: auto; font-size: 22px; animation: spinIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }
  .choices.revealed .choice { pointer-events: none; }

  .score {
    margin-top: 6px;
    font-family: "Fredoka", sans-serif;
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    color: #ffbf1f;
    -webkit-text-stroke: 0.06em #fff;
    paint-order: stroke fill;
    text-shadow: 0 5px 0 #e09000;
  }
  .score small { font-size: 30px; }
  .who-line { font-size: 16px; color: #7a6e98; }
  .rank { margin-top: 10px; font-size: clamp(22px, 5.6vw, 28px); color: #e09000; }
  .rank-msg { margin-top: 8px; font-size: 14px; font-weight: 500; line-height: 1.9; }

  /* 答え合わせ */
  .review { margin-top: 16px; display: grid; gap: 8px; text-align: left; }
  .rv { padding: 10px 12px; border-radius: 14px; background: #fffaf0; font-size: 13px; }
  .rv-q { color: #4a3d6b; }
  .rv-a { margin-top: 4px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; font-weight: 500; color: #7a6e98; }
  .rv-a b { color: #e09000; font-weight: 800; }
  .rv.ok { background: #f0fbf4; }
  .rv-mark { float: right; font-size: 18px; }

  .err-ico { font-size: 56px; }
</style>
</head>
<body>
  <span class="deco" style="--x:6%;--y:22%;--s:30px;--d:5s;--delay:0s">❓</span>
  <span class="deco" style="--x:88%;--y:74%;--s:34px;--d:6s;--delay:-2s">💡</span>
  <span class="deco" style="--x:5%;--y:78%;--s:26px;--d:4.6s;--delay:-1s">✨</span>

  <main class="page">
    <section class="screen" id="introScreen">
      <div class="panel">
        <div class="big-ico">🙋</div>
        <h1 class="title">わたしのこと知ってる？クイズ</h1>
        <p class="invite" id="inviteMsg" hidden></p>
        <p class="lead" id="introLead"></p>
        <button class="btn" id="introBtn" type="button">はじめる ▶</button>
      </div>
    </section>

    <section class="screen" id="nameScreen">
      <div class="panel">
        <div class="big-ico">✏️</div>
        <h2 class="title">あなたの名前は？</h2>
        <label class="name-label" for="nameInput">ニックネームでもOK（12文字まで）</label>
        <input class="name-input" id="nameInput" type="text" maxlength="12" autocomplete="nickname" placeholder="なまえ">
        <p class="name-error" id="nameError"></p>
        <button class="btn" id="nameBtn" type="button">つぎへ ▶</button>
      </div>
    </section>

    <section class="screen" id="quizScreen">
      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressText">1/8</span>
      </div>
      <div class="panel" id="questionPanel">
        <span class="q-num" id="qNum">Q1</span>
        <p class="q-text" id="qText"></p>
        <div class="choices" id="choices"></div>
        <button class="back" id="backBtn" type="button">← ひとつ前にもどる</button>
      </div>
    </section>

    <section class="screen" id="linkScreen">
      <div class="panel">
        <div class="big-ico">📨</div>
        <h2 class="title">クイズができたよ！</h2>
        <p class="lead">このURLを送ると、相手があなたの答えを当てるクイズになるよ。<br>何問当ててもらえるかな？</p>
        <div id="inviteShare"></div>
        <p class="note">※ URLの中に、あなたの名前と答えが入っています。<br>結果は、相手から結果のURLを送ってもらうと見られるよ。</p>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="panel">
        <p class="who-line" id="rWho"></p>
        <div class="score"><span id="rScore">0</span><small> / 8</small></div>
        <h2 class="rank" id="rRank"></h2>
        <p class="rank-msg" id="rMsg"></p>
        <div class="review" id="rReview"></div>
        <div id="sendBack" hidden>
          <p class="note" id="sendBackLead"></p>
          <div id="resultShare"></div>
        </div>
        <div class="actions">
          <a class="btn" href="./">🙋 自分のクイズを作る</a>
          <a class="btn sub" href="../">🔮 占い一覧へ</a>
        </div>
      </div>
    </section>

    <section class="screen" id="errorScreen">
      <div class="panel">
        <div class="err-ico">🤔</div>
        <h2 class="title">URLが読みこめなかった…</h2>
        <p class="lead">URLが途中で切れているかもしれません。<br>送ってくれた人に、もう一度URLを送ってもらってね。</p>
        <a class="btn" href="./">🙋 自分のクイズを作る</a>
      </div>
    </section>
  </main>

<script src="../../audio.js"></script>
<script src="../../common.js"></script>
<script src="../fortune.js"></script>
<script>
  // ===== 質問。{who} は「あなた」または「○○さん」に置きかわる =====
  const QUESTIONS = [
    { q: "{who}の好きな季節は？", a: ["春", "夏", "秋", "冬"] },
    { q: "{who}がいちばん好きな食べ物は？", a: ["ごはん・和食", "ラーメン・麺類", "パン・洋食", "スイーツ"] },
    { q: "{who}は朝型？夜型？", a: ["完全に朝型", "どちらかといえば朝", "どちらかといえば夜", "完全に夜型"] },
    { q: "{who}が休みの日にしがちなのは？", a: ["外に遊びに行く", "家でゴロゴロ", "趣味に没頭", "友だちと通話・チャット"] },
    { q: "{who}が好きな動物は？", a: ["いぬ", "ねこ", "うさぎ", "とり"] },
    { q: "{who}がいま行ってみたいのは？", a: ["海", "山", "遊園地", "外国"] },
    { q: "{who}のストレス解消法は？", a: ["寝る", "食べる", "歌う・音楽を聴く", "体を動かす"] },
    { q: "{who}が生まれ変わるなら？", a: ["鳥になって空を飛ぶ", "大金持ち", "天才", "もう一度自分"] },
  ];

  const ANSWER_RE = new RegExp("^[0-3]{" + QUESTIONS.length + "}$");
  const validPerson = p => p && Fortune.validName(p.n) && typeof p.a === "string" && ANSWER_RE.test(p.a);
  const withWho = (list, who) => list.map(x => ({ ...x, q: x.q.replace("{who}", who) }));

  const show = Fortune.screens(["introScreen", "nameScreen", "quizScreen", "linkScreen", "resultScreen", "errorScreen"]);
  const params = new URLSearchParams(location.search);
  let owner = null; // クイズを作った人（1人目）
  let myName = "";

  // ===== URL を見て、どこから始めるか決める =====
  if (params.has("r")) {
    try {
      const d = Fortune.decode(params.get("r"));
      if (!validPerson(d.a) || !validPerson(d.b)) throw new Error("bad");
      showResult(d.a, d.b, false);
    } catch (e) {
      show("errorScreen");
    }
  } else if (params.has("d")) {
    try {
      owner = Fortune.decode(params.get("d"));
      if (!validPerson(owner)) throw new Error("bad");
      const msg = document.getElementById("inviteMsg");
      msg.hidden = false;
      msg.innerHTML = "📨 <b></b> さんから<br>クイズがとどいたよ！";
      msg.querySelector("b").textContent = owner.n;
      const lead = document.getElementById("introLead");
      lead.textContent = `${owner.n}さんは8つの質問に何てこたえたかな？ 当ててみよう！`;
      show("introScreen");
    } catch (e) {
      show("errorScreen");
    }
  } else {
    document.getElementById("introLead").innerHTML = "まずはあなたが、自分のことを8つの質問でこたえてね。<br>できたURLを送ると、相手があなたの答えを当てるクイズになるよ！";
    show("introScreen");
  }

  // ===== スタート → 名前 → 質問 =====
  const nameInput = document.getElementById("nameInput");

  document.getElementById("introBtn").addEventListener("click", () => {
    Sound.se("open", { volume: 0.8 });
    show("nameScreen");
    setTimeout(() => nameInput.focus(), 350);
  });

  function submitName() {
    const v = nameInput.value.trim();
    if (!v) {
      document.getElementById("nameError").textContent = "名前を入れてね！";
      Sound.se("close", { volume: 0.6 });
      return;
    }
    document.getElementById("nameError").textContent = "";
    myName = v.slice(0, 12);
    Sound.se("click", { volume: 0.7 });
    show("quizScreen");
    makeQuiz().start();
  }
  document.getElementById("nameBtn").addEventListener("click", submitName);
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) submitName(); });

  const IDS = { num: "qNum", text: "qText", progressText: "progressText", fill: "progressFill", choices: "choices", back: "backBtn", panel: "questionPanel" };

  function makeQuiz() {
    if (!owner) {
      // 1人目: 自分のことをこたえる
      return Fortune.quiz({ questions: withWho(QUESTIONS, "あなた"), ids: IDS, onDone: finishOwner });
    }
    // 2人目: 1人目の答えを当てる。えらぶたびに正解発表（もどるボタンはなし）
    const ans = [...owner.a].map(Number);
    return Fortune.quiz({
      questions: withWho(QUESTIONS, owner.n + "さん"),
      ids: IDS,
      noBack: true,
      onPick(qi, ci, btn) {
        const box = document.getElementById("choices");
        box.classList.add("revealed");
        const buttons = box.querySelectorAll(".choice");
        const ok = ci === ans[qi];
        buttons[ans[qi]].classList.add("correct");
        buttons[ans[qi]].insertAdjacentHTML("beforeend", '<span class="judge">⭕</span>');
        if (!ok) {
          btn.classList.add("wrong");
          btn.insertAdjacentHTML("beforeend", '<span class="judge">❌</span>');
        }
        Sound.se(ok ? "accent" : "close", { volume: ok ? 0.6 : 0.7 });
        return 1100; // 発表を見てから次へ
      },
      onDone: guesses => showResult(owner, { n: myName, a: guesses.join("") }, true),
    });
  }

  function finishOwner(answers) {
    const url = Fortune.pageUrl + "?d=" + Fortune.encode({ v: 1, n: myName, a: answers.join("") });
    Fortune.share(document.getElementById("inviteShare"), url, `🙋 ${myName}さんから「わたしのこと知ってる？クイズ」がとどいたよ！何問当てられるかな？`);
    show("linkScreen");
    Sound.se("accent", { volume: 0.8 });
  }

  // ===== 結果（pa: クイズを作った人, pb: 当てた人） =====
  function rankOf(score, a) {
    if (score === 8) return ["💯 パーフェクト理解者", `全問正解！ ${a}さんのことを、だれよりもわかっている最強の理解者です。`];
    if (score >= 6) return [`🌟 ${a}さんマスター`, `ほとんど正解！ ${a}さんのことを、とってもよく見ているね。`];
    if (score >= 4) return ["😊 なかなか知ってる", `半分以上正解！ ${a}さんのことを、けっこうわかっているよ。`];
    if (score >= 2) return ["🌱 これから知っていこう", `まだまだ知らない${a}さんがいるみたい。いろんな話をしてみよう！`];
    return ["🫣 ナゾ多めの関係", `${a}さんはまだまだナゾだらけ！ これからたくさん知っていけるね。`];
  }

  function showResult(pa, pb, iAmGuesser) {
    const A = [...pa.a].map(Number);
    const B = [...pb.a].map(Number);
    const score = A.filter((v, i) => v === B[i]).length;
    const [rank, msg] = rankOf(score, pa.n);
    document.getElementById("rWho").textContent = `${pb.n}さんは、${pa.n}さんのことを…`;
    document.getElementById("rRank").textContent = rank;
    document.getElementById("rMsg").textContent = msg;

    // 答え合わせ
    const review = document.getElementById("rReview");
    review.innerHTML = "";
    withWho(QUESTIONS, pa.n + "さん").forEach((q, i) => {
      const ok = A[i] === B[i];
      const div = document.createElement("div");
      div.className = "rv" + (ok ? " ok" : "");
      div.innerHTML = `<span class="rv-mark">${ok ? "⭕" : "❌"}</span><div class="rv-q"></div>
        <div class="rv-a"><span class="n1"></span><b class="a1"></b><span class="n2"></span><span class="a2"></span></div>`;
      div.querySelector(".rv-q").textContent = `Q${i + 1}. ${q.q}`;
      div.querySelector(".n1").textContent = pa.n + "さん";
      div.querySelector(".a1").textContent = q.a[A[i]];
      div.querySelector(".n2").textContent = pb.n + "さんの予想";
      div.querySelector(".a2").textContent = q.a[B[i]];
      review.appendChild(div);
    });

    if (iAmGuesser) {
      const url = Fortune.pageUrl + "?r=" + Fortune.encode({ v: 1, a: pa, b: pb });
      document.getElementById("sendBack").hidden = false;
      document.getElementById("sendBackLead").textContent = `この結果を ${pa.n} さんにも送ってあげよう！`;
      Fortune.share(document.getElementById("resultShare"), url, `🙋 ${pb.n}さんは、${pa.n}さんのクイズで8問中${score}問正解！ 答え合わせを見てね`);
      history.replaceState(null, "", url);
    }

    show("resultScreen");
    Sound.se("accent", { volume: 0.9 });
    Fortune.countUp(document.getElementById("rScore"), score, 1000);
  }
</script>
</body>
</html>
