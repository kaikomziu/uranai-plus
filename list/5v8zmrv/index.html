<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相性診断 | UraNai+（うらないプラス）</title>
<meta name="description" content="ふたりの名前を入れるだけで相性がわかる！結果のURLを送っても、入れた名前は相手には見えないよ。">
<!-- OGP（SNS で URL を貼ったときに出るカード）。画像は tools/make-ogp.ps1 で作る -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UraNai+（うらないプラス）">
<meta property="og:title" content="相性診断 | UraNai+（うらないプラス）">
<meta property="og:description" content="ふたりの名前を入れるだけで相性がわかる！結果のURLを送っても、入れた名前は相手には見えないよ。">
<meta property="og:url" content="https://kaikomziu.github.io/uranai-plus/list/5v8zmrv/">
<meta property="og:image" content="https://kaikomziu.github.io/uranai-plus/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UraNai+ うらないプラス">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../common.css">
<link rel="stylesheet" href="../fortune.css">
<link rel="stylesheet" href="../aisho.css">
<style>
  .panel { box-shadow: 0 8px 0 #e2d6ff, 0 16px 40px rgba(155, 107, 255, 0.16); }

  .couple { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: clamp(18px, 5vw, 23px); }
  .couple .x { font-size: 1.3em; animation: aishoBeat 1.2s ease-in-out infinite; }
  .couple .hidden-name { color: #b0a6c8; letter-spacing: 0.1em; }

  .meter { position: relative; width: 150px; height: 150px; margin: 14px auto 0; }
  .meter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .meter .track { fill: none; stroke: #f1ebff; stroke-width: 14; }
  .meter .fill { fill: none; stroke: url(#meterGrad); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 402; stroke-dashoffset: 402; transition: stroke-dashoffset 1.6s cubic-bezier(.3,1,.4,1); }
  .meter .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Fredoka", sans-serif; font-size: 40px; font-weight: 700; color: #7646e0; }
  .meter .pct small { font-size: 20px; }

  .tier { margin-top: 10px; font-size: clamp(22px, 5.6vw, 28px); color: #7646e0; }
  .tier-msg { margin-top: 10px; font-size: 14px; font-weight: 500; line-height: 1.9; text-align: left; }

  .cats { margin-top: 16px; display: grid; grid-template-columns: max-content 1fr 2.8em; gap: 8px; align-items: center; font-size: 13px; text-align: left; white-space: nowrap; }
  .cat-bar { height: 10px; border-radius: 999px; background: #f1ebff; overflow: hidden; }
  .cat-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ff8cc0, #b69bff); transition: width 1s cubic-bezier(.3,1.3,.5,1); }
  .cats b { font-family: "Fredoka", sans-serif; color: #9b6bff; text-align: right; }

  .lock-box { margin-top: 14px; padding: 10px 12px; border-radius: 14px; background: #faf7ff; font-size: 12px; font-weight: 500; color: #7a6e98; line-height: 1.7; }
  .err-ico { font-size: 56px; }
</style>
</head>
<body>
  <span class="deco" style="--x:6%;--y:22%;--s:28px;--d:5s;--delay:0s">💞</span>
  <span class="deco" style="--x:88%;--y:76%;--s:30px;--d:6s;--delay:-2s">✨</span>

  <main class="page">
    <!-- 名前を入れる -->
    <section class="screen" id="formScreen">
      <div class="aisho-card">
        <h1 class="aisho-head">💞 相性診断</h1>
        <p class="aisho-lead">ふたりの名前を入れるだけで、相性がわかるよ。</p>
        <div class="aisho-names">
          <div class="aisho-field"><label for="nameA">あなたの名前</label><input class="aisho-input" id="nameA" maxlength="12" autocomplete="off" placeholder="なまえ"></div>
          <span class="aisho-x">💞</span>
          <div class="aisho-field"><label for="nameB">相手の名前</label><input class="aisho-input" id="nameB" maxlength="12" autocomplete="off" placeholder="なまえ"></div>
        </div>
        <p class="aisho-err" id="aishoErr"></p>
        <button class="aisho-btn" id="aishoBtn" type="button">診断する ▶</button>
        <p class="aisho-lock">🔒 入れた名前はこの端末にだけ保存されます。<br>結果のURLを送っても、相手には名前は見えないよ。</p>
      </div>
    </section>

    <section class="screen" id="loadingScreen">
      <div class="panel">
        <div class="ball">🔮</div>
        <p class="thinking">ふたりの相性をしらべ中<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
    </section>

    <!-- 結果 -->
    <section class="screen" id="resultScreen">
      <div class="panel">
        <div class="couple" id="couple"></div>
        <div class="meter">
          <svg viewBox="0 0 150 150" aria-hidden="true">
            <defs>
              <linearGradient id="meterGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff8cc0"/>
                <stop offset="1" stop-color="#9b6bff"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="75" cy="75" r="64"/>
            <circle class="fill" id="meterFill" cx="75" cy="75" r="64"/>
          </svg>
          <div class="pct"><span><span id="rPct">0</span><small>%</small></span></div>
        </div>
        <h2 class="tier" id="rTier"></h2>
        <p class="tier-msg" id="rMsg"></p>
        <div class="cats" id="rCats"></div>
        <div class="info">
          <div class="info-box wide"><h3>💡 ふたりへのアドバイス</h3><p id="rAdvice"></p></div>
          <div class="info-box"><h3>📍 おすすめスポット</h3><p id="rLucky"></p></div>
          <div class="info-box"><h3>🎨 ラッキーカラー</h3><p id="rColor"></p></div>
        </div>
        <p class="lock-box" id="lockBox"></p>
        <!-- 自分の端末のときだけ: 結果を送る -->
        <div id="shareBox" hidden>
          <div id="shareArea"></div>
        </div>
        <div class="actions">
          <a class="btn" href="./">💞 ほかの名前で診断</a>
          <a class="btn sub" href="../../">🏠 トップへ</a>
        </div>
      </div>
    </section>

    <section class="screen" id="errorScreen">
      <div class="panel">
        <div class="err-ico">🤔</div>
        <h2 class="title">URLが読みこめなかった…</h2>
        <p class="lead">URLが途中で切れているかもしれません。</p>
        <a class="btn" href="./">💞 相性診断をする</a>
      </div>
    </section>
  </main>

<script src="../../audio.js"></script>
<script src="../../common.js"></script>
<script src="../fortune.js"></script>
<script src="../aisho.js"></script>
<script>
  const show = Fortune.screens(["formScreen", "loadingScreen", "resultScreen", "errorScreen"]);
  const params = new URLSearchParams(location.search);

  if (params.has("r")) {
    let res = null;
    try {
      res = Aisho.read(params.get("r"));
    } catch (e) {
      show("errorScreen");
    }
    // 自分で診断した直後だけ「しらべ中」をはさむ（見たことのある結果や、送られてきた結果はすぐ出す）
    if (res) {
      const seenKey = "uranai-aisho-seen:" + params.get("r").slice(0, 60);
      if (res.names && !sessionStorage.getItem(seenKey)) {
        sessionStorage.setItem(seenKey, "1");
        Fortune.loading(show, "loadingScreen", 1600, () => render(res));
      } else {
        render(res);
      }
    }
  } else {
    show("formScreen");
    Aisho.bindForm({
      a: document.getElementById("nameA"),
      b: document.getElementById("nameB"),
      btn: document.getElementById("aishoBtn"),
      err: document.getElementById("aishoErr"),
    });
  }

  function render(res) {
    // 名前：この端末で診断したものなら名前を出し、それ以外は「？？？」
    const couple = document.getElementById("couple");
    couple.innerHTML = "";
    const nameEl = n => {
      const s = document.createElement("span");
      if (n) {
        s.textContent = n;
      } else {
        s.textContent = "？？？";
        s.className = "hidden-name";
      }
      return s;
    };
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "💞";
    couple.append(nameEl(res.names && res.names.a), x, nameEl(res.names && res.names.b));

    document.getElementById("rTier").textContent = res.tier;
    document.getElementById("rMsg").textContent = res.msg;
    document.getElementById("rAdvice").textContent = res.advice;
    document.getElementById("rLucky").textContent = res.lucky;
    document.getElementById("rColor").textContent = res.color;

    const box = document.getElementById("rCats");
    box.innerHTML = "";
    res.cats.forEach(c => {
      const name = document.createElement("span");
      name.textContent = c.name;
      const bar = document.createElement("div");
      bar.className = "cat-bar";
      bar.innerHTML = `<i data-w="${c.score}"></i>`;
      const num = document.createElement("b");
      num.textContent = c.score + "%";
      box.append(name, bar, num);
    });

    const lock = document.getElementById("lockBox");
    if (res.names) {
      lock.textContent = "🔒 名前はこの端末にだけ保存されています。このURLを送っても、相手の画面では名前は「？？？」になるよ。";
      document.getElementById("shareBox").hidden = false;
      Fortune.share(document.getElementById("shareArea"), location.href, `💞 相性診断の結果は… ${res.total}%！ だれとだれの相性かはひみつ🤫`);
    } else {
      lock.textContent = "🔒 だれとだれの相性かは、ひみつ。名前は診断した人の端末にだけ保存されています。";
    }

    show("resultScreen");
    Sound.se("accent", { volume: 0.9 });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.getElementById("meterFill").style.strokeDashoffset = 402 * (1 - res.total / 100);
      box.querySelectorAll("i").forEach(i => (i.style.width = i.dataset.w + "%"));
    }));
    Fortune.countUp(document.getElementById("rPct"), res.total, 1600);
  }
</script>
</body>
</html>
