<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おみくじ | UraNai+（うらないプラス）</title>
<meta name="description" content="1日1回ひけるおみくじ！大吉が出るかな？願い事・恋愛・学業など、今日の運勢をチェックしよう。">
<!-- OGP（SNS で URL を貼ったときに出るカード）。画像は tools/make-ogp.ps1 で作る -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UraNai+（うらないプラス）">
<meta property="og:title" content="おみくじ | UraNai+（うらないプラス）">
<meta property="og:description" content="1日1回ひけるおみくじ！大吉が出るかな？願い事・恋愛・学業など、今日の運勢をチェックしよう。">
<meta property="og:url" content="https://kaikomziu.github.io/uranai-plus/list/0ll1z1i/">
<meta property="og:image" content="https://kaikomziu.github.io/uranai-plus/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="UraNai+ うらないプラス">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../common.css">
<link rel="stylesheet" href="../fortune.css">
<style>
  /* おみくじは赤と白の神社っぽい色 */
  .panel { box-shadow: 0 8px 0 #ffc2c2, 0 16px 40px rgba(230, 70, 70, 0.18); }
  .title { color: #e5484d; }

  /* ===== おみくじの箱 ===== */
  .stage { position: relative; height: 240px; margin-top: 10px; display: grid; place-items: end center; }

  .box {
    position: relative;
    width: 110px;
    height: 180px;
    border: none;
    border-radius: 20px 20px 16px 16px;
    background: linear-gradient(90deg, #d93b40, #ff5f5f 45%, #d93b40);
    box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.12), 0 6px 0 #b8282d;
    cursor: pointer;
    transform-origin: 50% 80%;
    z-index: 2;
  }
  .box::before {
    content: "おみくじ";
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(-50%);
    writing-mode: vertical-rl;
    padding: 10px 6px;
    border-radius: 8px;
    background: #fff8ec;
    color: #d93b40;
    font-size: 20px;
    letter-spacing: 0.15em;
  }
  .box::after {
    /* 上の穴 */
    content: "";
    position: absolute;
    left: 50%;
    top: 8px;
    width: 18px;
    height: 10px;
    margin-left: -9px;
    border-radius: 50%;
    background: #6b1316;
  }
  .box.shake { animation: shake 0.5s ease-in-out 3; }
  .box:disabled { cursor: default; }

  /* 出てくる棒 */
  .stick {
    position: absolute;
    left: 50%;
    bottom: 160px;
    width: 14px;
    height: 70px;
    margin-left: -7px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e8c48a, #f6dcab, #e8c48a);
    opacity: 0;
    z-index: 1;
    display: grid;
    place-items: start center;
    padding-top: 6px;
    font-size: 9px;
    color: #a0522d;
    writing-mode: vertical-rl;
  }
  .stick.out { animation: stickOut 0.7s cubic-bezier(.3,1.6,.5,1) both; }

  .tap-hint { margin-top: 14px; font-size: 15px; color: #e5484d; animation: blink 1.2s infinite; }

  /* ===== 結果の紙 ===== */
  .paper {
    position: relative;
    padding: 22px 18px;
    border-radius: 10px;
    background:
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(229, 72, 77, 0.06) 31px 32px),
      #fffdf7;
    border: 2px solid #f3d9b5;
    text-align: center;
    animation: unroll 0.8s cubic-bezier(.3,1.2,.5,1) both;
    transform-origin: top center;
  }
  .paper-no { font-size: 13px; color: #b08a5a; }
  .grade {
    margin-top: 6px;
    font-size: 64px;
    line-height: 1.1;
    color: var(--gc, #e5484d);
    -webkit-text-stroke: 0.06em #fff;
    paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
    animation: spinIn 0.8s cubic-bezier(.3,1.6,.5,1) 0.3s both;
  }
  .grade-msg { margin-top: 8px; font-size: 14px; font-weight: 500; line-height: 1.8; }

  .rows { margin-top: 14px; display: grid; gap: 6px; text-align: left; }
  .row {
    display: grid;
    grid-template-columns: 4.5em 1fr;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 12px;
    background: #fff6ea;
    font-size: 13px;
  }
  .row b { color: #e5484d; }
  .row span { font-weight: 500; }

  .again-note { margin-top: 12px; font-size: 12px; font-weight: 500; color: #9b8bc4; }

  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-18deg); }
    50% { transform: rotate(16deg); }
    80% { transform: rotate(-8deg); }
  }
  @keyframes stickOut {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(-20px); }
  }
  @keyframes unroll {
    from { opacity: 0; transform: scaleY(0.1); }
    to { opacity: 1; transform: scaleY(1); }
  }
</style>
</head>
<body>
  <span class="deco" style="--x:6%;--y:22%;--s:30px;--d:5s;--delay:0s">⛩️</span>
  <span class="deco" style="--x:88%;--y:74%;--s:34px;--d:6s;--delay:-2s">🎍</span>
  <span class="deco" style="--x:5%;--y:78%;--s:26px;--d:4.6s;--delay:-1s">🌸</span>

  <main class="page">
    <section class="screen show" id="drawScreen">
      <div class="panel">
        <h1 class="title">⛩️ おみくじ</h1>
        <p class="lead">1日1回ひけるよ。<br>箱をタップしてふってみよう！</p>
        <div class="stage">
          <div class="stick" id="stick"></div>
          <button class="box" id="box" type="button" aria-label="おみくじの箱をふる"></button>
        </div>
        <p class="tap-hint" id="tapHint">▲ タップしてふる</p>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="panel">
        <div class="paper" id="paper">
          <div class="paper-no" id="rNo"></div>
          <div class="grade" id="rGrade"></div>
          <p class="grade-msg" id="rMsg"></p>
          <div class="rows" id="rRows"></div>
        </div>
        <div class="share-row" id="shareRow"></div>
        <p class="again-note" id="againNote">次は明日ひけるよ。また来てね！</p>
        <div class="actions">
          <a class="btn sub" href="../">🔮 占い一覧へ</a>
        </div>
      </div>
    </section>
  </main>

<script src="../../audio.js"></script>
<script src="../../common.js"></script>
<script src="../fortune.js"></script>
<script>
  const show = Fortune.screens(["drawScreen", "resultScreen"]);
  const SAVE_KEY = "uranai-omikuji";

  // ===== 運勢の種類（w は出やすさ） =====
  const GRADES = [
    { name: "大吉", w: 15, tone: 0, color: "#e5484d", msg: "最高の運勢！ いまのあなたには、幸運の風が強く吹いています。思いきって行動すれば、願いがかなう予感。" },
    { name: "中吉", w: 20, tone: 0, color: "#ff7a3d", msg: "とてもいい運勢。まわりの人を大切にすると、さらに大きな幸せがやってきます。" },
    { name: "小吉", w: 20, tone: 1, color: "#e0a400", msg: "小さな幸せがたくさん見つかる運勢。身近なことに目を向けると、うれしい発見がありそう。" },
    { name: "吉", w: 20, tone: 1, color: "#3ec97a", msg: "おだやかで安定した運勢。いつもどおりコツコツすごすことが、幸運への近道です。" },
    { name: "末吉", w: 15, tone: 2, color: "#3fb4ff", msg: "これから運気が上がっていく運勢。今は種まきの時期。あせらず続ければ、きっと花が咲くよ。" },
    { name: "凶", w: 10, tone: 2, color: "#7646e0", msg: "ちょっと慎重に、の合図。でも凶はこれ以上下がらない＝あとは上がるだけ！ ていねいにすごせば大丈夫。" },
  ];

  // 項目ごとの言葉（tone 0: いい / 1: ふつう / 2: 気をつけて）
  const ROWS = [
    ["願い事", ["思いのままにかなうでしょう", "少し時間がかかるがかなう", "人の助けをかりるとよし"]],
    ["恋愛", ["思いが通じあう予感", "あせらず自然体でいるのが吉", "今は自分みがきの時"]],
    ["学業", ["努力が大きく実をむすぶ", "復習をていねいにすればよし", "基本に立ちかえるべし"]],
    ["健康", ["元気いっぱいにすごせる", "よく寝てよく食べるべし", "無理はせず早めに休むべし"]],
    ["待ち人", ["うれしい知らせとともに来る", "おそいけれど来る", "こちらから会いに行くべし"]],
    ["失せ物", ["すぐに見つかる", "高いところをさがせ", "しばらくして出てくる"]],
    ["旅行", ["どこへ行っても楽しい", "近場がおすすめ", "準備をしっかりすればよし"]],
  ];

  function drawGrade() {
    const total = GRADES.reduce((s, g) => s + g.w, 0);
    let r = Math.random() * total;
    for (const g of GRADES) {
      if ((r -= g.w) < 0) return g;
    }
    return GRADES[0];
  }

  // 今日もうひいていたら、その結果を出す
  function loadToday() {
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (saved && saved.date === Fortune.today()) return saved;
    } catch (e) { /* 何もしない */ }
    return null;
  }

  const box = document.getElementById("box");
  const stick = document.getElementById("stick");

  box.addEventListener("click", () => {
    if (box.disabled) return;
    box.disabled = true;
    document.getElementById("tapHint").style.visibility = "hidden";
    box.classList.add("shake");
    // ふっている間はカラカラ音
    let n = 0;
    const timer = setInterval(() => Sound.se("tick", { volume: 0.45, rate: 0.9 + (n++ % 3) * 0.15 }), 160);
    setTimeout(() => {
      clearInterval(timer);
      box.classList.remove("shake");
      const g = drawGrade();
      const result = {
        date: Fortune.today(),
        no: 1 + Math.floor(Math.random() * 100),
        grade: GRADES.indexOf(g),
        rows: ROWS.map(([, words]) => Math.floor(Math.random() * 3)), // 同じ運勢の中でも少し変化をつける
      };
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(result)); } catch (e) { /* 保存できなくても続ける */ }
      stick.textContent = result.no + "番";
      stick.classList.add("out");
      Sound.se("whoosh", { volume: 0.6 });
      setTimeout(() => render(result, true), 900);
    }, 1550);
  });

  function render(result, fresh) {
    const g = GRADES[result.grade];
    document.getElementById("paper").style.setProperty("--gc", g.color);
    document.getElementById("rNo").textContent = `第${result.no}番`;
    document.getElementById("rGrade").textContent = g.name;
    document.getElementById("rMsg").textContent = g.msg;
    const rows = document.getElementById("rRows");
    rows.innerHTML = "";
    ROWS.forEach(([label, words], i) => {
      // 基本はその運勢の言葉。たまに1段だけとなりの言葉にする（毎回同じにならないように）
      const shift = result.rows[i] === 0 ? -1 : result.rows[i] === 2 ? 1 : 0;
      const tone = Math.min(2, Math.max(0, g.tone + (Math.abs(shift) && i % 2 ? shift : 0)));
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = "<b></b><span></span>";
      row.querySelector("b").textContent = label;
      row.querySelector("span").textContent = words[tone];
      rows.appendChild(row);
    });
    document.getElementById("againNote").textContent = fresh ? "次は明日ひけるよ。また来てね！" : "今日はもうひいたよ。次は明日ひけるよ！";
    Fortune.shareText(document.getElementById("shareRow"), `⛩️ 今日のおみくじは「${g.name}」でした！`);
    show("resultScreen");
    if (fresh) Sound.se("accent", { volume: 0.9 });
  }

  const todays = loadToday();
  if (todays) render(todays, false);
</script>
</body>
</html>
